name: docker publish

on:
  # allow manually run the action:
  workflow_dispatch:


jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out publisher
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Make package
        run: | 
          git clone https://github.com/apache/iotdb.git
          cd iotdb
          git checkout v2.0.11
          git apply "$GITHUB_WORKSPACE/.github/patches/iotdb-2.0.11-java4shell.patch"
          cd docker/src/main
          mkdir target
          cd target
          wget https://dlcdn.apache.org/iotdb/2.0.11/apache-iotdb-2.0.11-all-bin.zip
          cd ../DockerCompose
          sed -i 's/ docker run --rm --privileged tonistiigi/# docker run --rm --privileged tonistiigi/' do-docker-build.sh
          ./do-docker-build.sh -t confignode -v 2.0.11 -p
          ./do-docker-build.sh -t datanode -v 2.0.11 -p
          ./do-docker-build.sh -t standalone -v 2.0.11 -p
          ./do-docker-build.sh -t latest -v 2.0.11 -p
          

