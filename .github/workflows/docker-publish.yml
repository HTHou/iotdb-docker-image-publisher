name: docker publish

on:
  # allow manually run the action:
  workflow_dispatch:


jobs:

  build:
    runs-on: self-hosted

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Make package
        run: | 
          git clone https://github.com/apache/iotdb.git
          cd iotdb
          cd docker/src/main
          mkdir target
          cd target
          wget https://dlcdn.apache.org/iotdb/2.0.5/apache-iotdb-2.0.5-all-bin.zip
          wget https://dlcdn.apache.org/iotdb/2.0.5/apache-iotdb-2.0.5-confignode-bin.zip
          wget https://dlcdn.apache.org/iotdb/2.0.5/apache-iotdb-2.0.5-datanode-bin.zip
          wget https://dlcdn.apache.org/iotdb/2.0.5/apache-iotdb-2.0.5-ainode-bin.zip
          cd ../DockerCompose
          sed -i 's/ docker run --rm --privileged tonistiigi/# docker run --rm --privileged tonistiigi/' do-docker-build.sh
          sed -i 's/--platform=$TARGETPLATFORM//g' do-docker-build.sh
          ./do-docker-build.sh -t all -v 2.0.5 -b -p
          

